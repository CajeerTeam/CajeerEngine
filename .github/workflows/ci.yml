name: Baseline quality gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, sodium, zip, dom, xml, xmlreader, xmlwriter, curl, gd, pcntl
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Composer schema and platform
        run: |
          composer validate --strict
          composer check-platform-reqs
      - name: Verify PHP, published assets, versions and API contract
        run: |
          node admin/scripts/publish-admin-assets.mjs --check > /dev/null
          php tools/generate-api-sdk.php --check
          php tools/ci-check.php --strict
          php bin/cajeer api:lint --strict --json
          php tools/build-release.php --dry-run --all --json > /dev/null
      - name: Operational documentation contract and negative regressions
        run: |
          php tools/operations-docs-check.php
          php tools/operations-docs-regression.php
      - name: Database dialect and migration compatibility regression
        run: |
          php tools/database-compatibility-regression.php
          python3 tools/database-compatibility-sqlite-regression.py
      - name: RC payload, certification and prerelease publication regressions
        run: |
          python3 tools/certification-regression.py
          python3 tools/github-publish-regression.py
          php tools/release-regression.php
      - name: External analytics production regression (Search Console sitemap and credential privacy)
        run: |
          php tools/search-webmaster-regression.php --require-db
          php tools/analytics-hub-regression.php --require-db
      - name: Extension compatibility and update preflight regression
        run: |
          php tools/compatibility-upgrade-regression.php
          php tools/github-release-regression.php
      - name: Deployment and disaster recovery acceptance (actual SQLite)
        run: |
          php tools/deployment-recovery-acceptance.php
          php tools/disaster-recovery-regression.php
      - name: Runtime and queue fault-injection acceptance
        run: php tools/runtime-queue-resilience-regression.php
      - name: Security hardening acceptance
        run: |
          php tools/security-hardening-regression.php
          php tools/security-privacy-production-regression.php
          php tools/security-privacy-production-integration.php --require-db
      - name: SkiF4er ID production OIDC protocol and introspection acceptance
        run: |
          php tools/oidc-regression.php
          php tools/oidc-api-regression.php
          php tools/oidc-global-logout-regression.php
          php tools/skif4er-id-production-regression.php
      - name: Concurrent performance and SQL search acceptance
        run: |
          php tools/performance-load-regression.php
          php tools/queue-throughput-regression.php
          php tools/performance-search-integration.php
          php tools/performance-scalability-regression.php
          python3 tools/performance-scalability-sqlite-regression.py
          python3 tools/staging-load-regression.py
      - name: Migration Center production safety and lossless import regression
        run: php tools/migration-production-regression.php
      - name: AI Assistant production SSE, function dispatch and privacy regression
        run: php tools/ai-assistant-production-regression.php
      - name: Full unit and integration test suite
        run: vendor/bin/phpunit --no-coverage
      - name: End-to-end acceptance (real HTTP, SQLite, CMS, queue and AI)
        run: bash tools/e2e-acceptance.sh
      - name: Static analysis
        run: composer analyse
      - name: Build admin and SDK
        run: |
          npm install --prefix admin --no-audit --no-fund
          npm run build --prefix admin
          npm install --prefix packages/ts-sdk --no-audit --no-fund
          npm run build --prefix packages/ts-sdk
          node tools/sdk-client-compatibility-regression.mjs
