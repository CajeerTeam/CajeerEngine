name: Release verification and publication
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cajeer
          POSTGRES_PASSWORD: release-smoke
          POSTGRES_DB: cajeer_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cajeer -d cajeer_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: migration-fixture
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, sodium, zip, dom, xml, xmlreader, xmlwriter, curl, openssl, gd, redis, pcntl
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Deployment safety regression (real Nginx TLS)
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          sudo python3 deploy/test_production.py
      - name: Concurrent rate limiter and certification regressions
        run: |
          php tools/rate-limit-concurrency.php
          python3 tools/certification-regression.py
      - name: SkiF4er ID signed JWT / PKCE regression
        run: php tools/oidc-regression.php
      - name: SkiF4er ID SQL transaction regression
        run: python3 tools/oidc-sqlite-regression.py
      - name: SkiF4er ID real PHP PDO / sodium session regression
        run: php tools/oidc-db-regression.php --require-db
      - name: SkiF4er ID account linking / provisioning via real PDO SQLite
        run: |
          php tools/oidc-account-linking-regression.php --require-db
          python3 tools/oidc-account-linking-sqlite-regression.py
      - name: SkiF4er ID SSO and Back-Channel Logout regressions
        run: |
          php tools/oidc-global-logout-regression.php
          python3 tools/oidc-global-logout-sqlite-regression.py
          php tools/oidc-global-logout-integration.php --require-db
      - name: SkiF4er ID API access token RS256 and live introspection regression
        run: php tools/oidc-api-regression.php
      - name: SkiF4er ID API real PHP PDO / HTTP middleware integration
        run: php tools/oidc-api-integration.php --require-db
      - name: RBAC & Authentication Assurance signed OIDC, SQLite and HTTP integration
        run: |
          php tools/assurance-oidc-regression.php
          python3 tools/assurance-sqlite-regression.py
          php tools/assurance-integration.php --require-db
      - name: Identity Center Admin UX real SQL, auth middleware and atomic session revocation
        run: php tools/identity-center-integration.php --require-db
      - name: Identity 1.5.9 acceptance, resumable session migration and strict cutover (real PDO)
        run: php tools/identity-session-acceptance-integration.php --require-db
      - name: Identity 1.6.0 GA production SSO, self-link, transaction rollback, revocation (real PDO)
        run: php tools/identity-ga-integration.php --require-db
      - name: AI Tools real Responses function calling and scope security
        run: php tools/ai-tools-regression.php
      - name: AI Tools PDO Knowledge Base execution, tool history and budget acceptance
        run: php tools/ai-tools-integration.php --require-db
      - name: OpenAI AI Chat credential encryption and rotation
        run: php tools/ai-vault-regression.php
      - name: AI Chat real PDO SQLite persistence, ownership and budget acceptance
        run: php tools/ai-chat-integration.php --require-db
      - name: AI Content Editor real PDO, schema, budget, ownership and revision acceptance
        run: php tools/ai-editor-integration.php --require-db
      - name: AI Content Editor schema and text-field validation without provider
        run: php tools/ai-editor-context-regression.php
      - name: AI SEO Assistant real CMS audit, metadata normalization and route analysis
        run: php tools/ai-seo-regression.php
      - name: AI SEO Assistant real PHP/PDO suggestions, revision approval and budget
        run: php tools/ai-seo-integration.php --require-db
      - name: AI Translation Studio deterministic tokenizer / placeholder regression
        run: php tools/ai-translation-regression.php
      - name: AI Translation Studio real PDO proposal, glossary, stale revision and approval
        run: php tools/ai-translation-integration.php --require-db
      - name: AI CMS Diagnostics real operational probes, sanitized evidence and provider budget acceptance
        run: php tools/ai-cms-diagnostics-regression.php --require-db
      - name: AI Knowledge Base real PDO, indexed search, CMS source staleness and document revision acceptance
        run: php tools/ai-knowledge-integration.php --require-db
      - name: AI Knowledge Chat RAG real PDO, private sessions, source revocation and shared budget
        run: php tools/ai-knowledge-chat-integration.php --require-db
      - name: AI outbound credential boundary (offline, fail closed)
        run: php tools/ai-security-regression.php
      - name: AI Support CAS and retention SQL fault injection
        run: python3 tools/ai-sql-resilience-regression.py
      - name: AI retention, SQL rollback and active-session preservation (real PDO)
        run: php tools/ai-retention-integration.php --require-db
      - name: AI Support Center visitor capability, operator queue, grounded AI and handoff acceptance
        run: php tools/ai-support-integration.php --require-db
      - name: AI GA real PHP/PDO acceptance, security and asset readiness
        run: php tools/ai-ga-acceptance-regression.php --require-db
      - name: AI GA competing support replies, rollback and RAG in-flight retention
        run: python3 tools/ai-ga-sqlite-regression.py
      - name: AI Support Center SQL schema and optimistic update regression
        run: python3 tools/ai-support-sqlite-regression.py
      - name: AI Support Center public widget and admin SPA Chromium regression
        run: python3 tools/ai-support-browser.py
      - name: Identity GA SQL rollback and selective revocation (SQLite)
        run: python3 tools/identity-ga-sqlite-regression.py
      - name: Unified Session Management PDO / SQLite integration
        run: |
          python3 tools/unified-sessions-sqlite-regression.py
          php tools/unified-sessions-regression.php --require-db
      - name: Security & Resilience real encrypted data rotation with PDO SQLite
        run: php tools/security-resilience-regression.php --require-db
      - run: php tools/security-regression.php
      - run: php tools/integration-regression.php
      - run: php tools/consent-regression.php
      - run: php tools/tracking-regression.php
      - run: php tools/analytics-events-regression.php
      - run: php tools/analytics-hub-regression.php --require-db
      - run: php tools/analytics-ga-regression.php --require-db
      - name: Migration discovery real XML and MariaDB regression
        env:
          MIGRATION_TEST_MYSQL: '1'
          MIGRATION_TEST_MYSQL_PASSWORD: migration-fixture
        run: php tools/migration-discovery-regression.php --require-xml --require-mysql
      - run: php tools/migration-planning-regression.php --require-xml
      - name: DLE migration actual MariaDB source and SQLite target
        env:
          MIGRATION_TEST_MYSQL: '1'
          MIGRATION_TEST_MYSQL_PASSWORD: migration-fixture
        run: php tools/dle-migration-regression.php --require-db --require-mysql
      - run: python3 tools/dle-migration-sqlite-regression.py
      - name: WordPress migration WXR, REST and MariaDB into SQLite
        env:
          MIGRATION_TEST_MYSQL: '1'
          MIGRATION_TEST_MYSQL_PASSWORD: migration-fixture
        run: php tools/wordpress-migration-regression.php --require-db --require-xml --require-mysql
      - run: python3 tools/wordpress-migration-sqlite-regression.py
      - run: php tools/identity-migration-regression.php --require-db
      - run: python3 tools/identity-migration-sqlite-regression.py
      - run: php tools/media-migration-regression.php
      - run: php tools/seo-url-migration-regression.php
      - run: python3 tools/seo-url-migration-sqlite-regression.py
      - run: python3 tools/migration-execution-sqlite-regression.py
      - run: php tools/migration-execution-regression.php --require-db
      - run: php tools/migration-validation-regression.php
      - run: php tools/migration-ga-regression.php
      - run: python3 tools/migration-validation-sqlite-regression.py
      - run: php tools/seo-url-migration-integration.php --require-db --require-db
      - run: python3 tools/media-migration-sqlite-regression.py
      - run: python3 tools/analytics-ga-upgrade-regression.py
      - run: php tools/search-webmaster-regression.php --require-db
      - run: php tools/alternative-analytics-regression.php --require-db
      - run: php tools/cloudflare-analytics-regression.php --require-db
      - run: php tools/advertising-regression.php
      - name: Consent browser regression (Chromium)
        run: |
          python3 -m venv /tmp/ce-consent-browser
          /tmp/ce-consent-browser/bin/pip install playwright
          /tmp/ce-consent-browser/bin/python -m playwright install --with-deps chromium
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/consent-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/oidc-admin-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/oidc-account-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/unified-sessions-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/oidc-global-logout-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/assurance-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/identity-center-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/ai-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/ai-editor-browser.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/ai-seo-browser.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/ai-translation-browser.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/ai-cms-diagnostics-browser.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/ai-knowledge-browser.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/ai-knowledge-chat-browser.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/tracking-browser-regression.py --network
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/analytics-events-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/alternative-analytics-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/cloudflare-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/advertising-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/analytics-ga-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/migration-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/migration-planning-browser-regression.py
          CHROMIUM_PATH=$(/tmp/ce-consent-browser/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()') /tmp/ce-consent-browser/bin/python tools/migration-validation-browser-regression.py
      - run: php tools/generate-api-sdk.php --check
      - run: php bin/cajeer api:lint --strict --json
      - run: php tools/github-release-regression.php
      - run: python3 tools/github-publish-regression.py
      - run: php tools/release-regression.php
      - run: php tools/update-regression.php
      - run: php tools/disaster-recovery-regression.php
      - run: php tools/import-regression.php
      - run: php tools/extension-regression.php
      - run: php tools/routing-regression.php
      - run: php tools/routing-regression.php --database
      - run: php tools/media-regression.php
      - run: php tools/media-regression.php --database
      - run: php tools/rendering-regression.php
      - run: php tools/rendering-regression.php --database
      - run: php tools/import-regression.php --database
      - run: php tools/search-regression.php
      - run: php tools/search-regression.php --database
      - run: php tools/performance-regression.php
      - run: php tools/queue-regression.php
      - run: php tools/observability-regression.php
      - run: php tools/observability-regression.php --database
      - run: php tools/queue-regression.php --redis
        env:
          CE_QUEUE_REDIS_HOST: 127.0.0.1
      - name: PostgreSQL queue and scheduler integration
        run: php tools/queue-regression.php --pgsql
        env:
          CE_QUEUE_PG_DSN: pgsql:host=127.0.0.1;port=5432;dbname=cajeer_smoke
          CE_QUEUE_PG_USER: cajeer
          CE_QUEUE_PG_PASSWORD: release-smoke
      - run: php tools/performance-regression.php --database
      - run: python3 tools/database-benchmark.py
      - name: Install matching PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/ce-pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: PostgreSQL backup restore round-trip
        env:
          PGPASSWORD: release-smoke
          CE_BACKUP_DB_TEST: '1'
          DB_DRIVER: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: cajeer_backup_test
          DB_USERNAME: cajeer
          DB_PASSWORD: release-smoke
        run: |
          createdb -h 127.0.0.1 -U cajeer cajeer_backup_test
          php tools/backup-db-regression.php
          php tools/disaster-recovery-regression.php --pgsql
      - name: PostgreSQL CMS search integration
        env:
          PGPASSWORD: release-smoke
          CE_SEARCH_PG_TEST: '1'
          DB_DRIVER: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: cajeer_search_test
          DB_USERNAME: cajeer
          DB_PASSWORD: release-smoke
        run: |
          createdb -h 127.0.0.1 -U cajeer cajeer_search_test
          php tools/search-regression.php --pgsql
      - name: PostgreSQL database performance integration
        env:
          PGPASSWORD: release-smoke
          CE_PERFORMANCE_PG_TEST: '1'
          DB_DRIVER: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: cajeer_performance_test
          DB_USERNAME: cajeer
          DB_PASSWORD: release-smoke
        run: |
          createdb -h 127.0.0.1 -U cajeer cajeer_performance_test
          php tools/performance-regression.php --pgsql
      - name: Audit locked runtime dependencies (fail closed)
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          test -s composer.lock
          composer audit --locked --no-dev --format=json --abandoned=fail > "$RUNNER_TEMP/release/dependency-audit.json"
      - run: bash tools/release-pipeline.sh "$RUNNER_TEMP/release"
      - run: bash tools/release-smoke.sh "$RUNNER_TEMP/release/cajeerengine-$(cat VERSION)-dist.zip" sqlite
      - run: bash tools/release-smoke.sh "$RUNNER_TEMP/release/cajeerengine-$(cat VERSION)-dist.zip" pgsql
        env:
          CE_DB_NAME: cajeer_smoke
          CE_DB_USER: cajeer
          CE_DB_PASSWORD: release-smoke
      - run: bash tools/disaster-recovery-dist-smoke.sh "$RUNNER_TEMP/release/cajeerengine-$(cat VERSION)-dist.zip"
      - run: bash tools/update-dist-smoke.sh "$RUNNER_TEMP/release/cajeerengine-$(cat VERSION)-dist.zip"
      - name: Production deployment on real Linux services
        env:
          CE_DB_USER: cajeer
          CE_DB_PASSWORD: release-smoke
          CE_DEPLOY_DISPOSABLE: 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common ca-certificates
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          candidate="$(apt-cache policy php8.4-fpm | awk '/Candidate:/ {print $2}')"
          test -n "$candidate" && test "$candidate" != "(none)"
          sudo apt-get install -y php8.4-fpm php8.4-pgsql php8.4-mbstring php8.4-gd php8.4-curl php8.4-xml php8.4-zip
          /usr/bin/php8.4 --version
          /usr/sbin/php-fpm8.4 --version
          sudo python3 deploy/test_production.py Safety.test_fpm_journal_socket_startup
          export CE_CERT_REPORT="$RUNNER_TEMP/release/production-acceptance.json"
          sudo --preserve-env=CE_DB_USER,CE_DB_PASSWORD,CE_DEPLOY_DISPOSABLE,CE_CERT_REPORT bash deploy/host-smoke.sh "$RUNNER_TEMP/release/cajeerengine-$(cat VERSION)-dist.zip"
      - name: Seal production certification for exact release bytes
        run: python3 tools/certification-evidence.py seal "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v7
        with:
          name: cajeerengine-verified-release
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256
            ${{ runner.temp }}/release/*.sig
            ${{ runner.temp }}/release/*.manifest.json
            ${{ runner.temp }}/release/*-artifacts.json
            ${{ runner.temp }}/release/certification.json
            ${{ runner.temp }}/release/production-acceptance.json
            ${{ runner.temp }}/release/dependency-audit.json
          if-no-files-found: error

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, zip, mbstring
      - uses: actions/download-artifact@v7
        with:
          name: cajeerengine-verified-release
          path: ${{ runner.temp }}/verified-release
      - name: Verify production certification before accessing signing key
        run: python3 tools/certification-evidence.py verify "$RUNNER_TEMP/verified-release"
      - name: Sign verified artifacts
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/verified-release
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          [[ "${GITHUB_REPOSITORY,,}" == cajeerteam/cajeerengine ]]
          [[ -n "$RELEASE_SIGNING_KEY" ]]
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          unset RELEASE_SIGNING_KEY
          for mode in source dist; do
            name="cajeerengine-$version-$mode.zip"
            (cd "$RELEASE_DIR" && sha256sum --strict --check "$name.sha256")
            php bin/cajeer release:verify --"$mode" --strict --artifact="$RELEASE_DIR/$name" --json
            php bin/cajeer release:sign --package="$RELEASE_DIR/$name" --secret-key="$key"
          done
      - name: Publish signed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/verified-release
        run: bash tools/github-publish-release.sh "$RELEASE_DIR" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
