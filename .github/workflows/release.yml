name: Release verification
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cajeer
          POSTGRES_PASSWORD: release-smoke
          POSTGRES_DB: cajeer_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cajeer -d cajeer_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, sodium, zip, dom, xml, xmlwriter, curl, openssl, gd, redis, pcntl
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: php tools/security-regression.php
      - run: php tools/generate-api-sdk.php --check
      - run: php bin/cajeer api:lint --strict --json
      - run: php tools/release-regression.php
      - run: php tools/update-regression.php
      - run: php tools/disaster-recovery-regression.php
      - run: php tools/import-regression.php
      - run: php tools/extension-regression.php
      - run: php tools/routing-regression.php
      - run: php tools/routing-regression.php --database
      - run: php tools/media-regression.php
      - run: php tools/media-regression.php --database
      - run: php tools/rendering-regression.php
      - run: php tools/rendering-regression.php --database
      - run: php tools/import-regression.php --database
      - run: php tools/search-regression.php
      - run: php tools/search-regression.php --database
      - run: php tools/performance-regression.php
      - run: php tools/queue-regression.php
      - run: php tools/observability-regression.php
      - run: php tools/observability-regression.php --database
      - run: php tools/queue-regression.php --redis
        env:
          CE_QUEUE_REDIS_HOST: 127.0.0.1
      - name: PostgreSQL queue and scheduler integration
        run: php tools/queue-regression.php --pgsql
        env:
          CE_QUEUE_PG_DSN: pgsql:host=127.0.0.1;port=5432;dbname=cajeer_smoke
          CE_QUEUE_PG_USER: cajeer
          CE_QUEUE_PG_PASSWORD: release-smoke
      - run: php tools/performance-regression.php --database
      - run: python3 tools/database-benchmark.py
      - name: Install matching PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/ce-pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: PostgreSQL backup restore round-trip
        env:
          PGPASSWORD: release-smoke
          CE_BACKUP_DB_TEST: '1'
          DB_DRIVER: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: cajeer_backup_test
          DB_USERNAME: cajeer
          DB_PASSWORD: release-smoke
        run: |
          createdb -h 127.0.0.1 -U cajeer cajeer_backup_test
          php tools/backup-db-regression.php
          php tools/disaster-recovery-regression.php --pgsql
      - name: PostgreSQL CMS search integration
        env:
          PGPASSWORD: release-smoke
          CE_SEARCH_PG_TEST: '1'
          DB_DRIVER: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: cajeer_search_test
          DB_USERNAME: cajeer
          DB_PASSWORD: release-smoke
        run: |
          createdb -h 127.0.0.1 -U cajeer cajeer_search_test
          php tools/search-regression.php --pgsql
      - name: PostgreSQL database performance integration
        env:
          PGPASSWORD: release-smoke
          CE_PERFORMANCE_PG_TEST: '1'
          DB_DRIVER: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: cajeer_performance_test
          DB_USERNAME: cajeer
          DB_PASSWORD: release-smoke
        run: |
          createdb -h 127.0.0.1 -U cajeer cajeer_performance_test
          php tools/performance-regression.php --pgsql
      - run: bash tools/release-pipeline.sh "$RUNNER_TEMP/release"
      - run: bash tools/release-smoke.sh "$RUNNER_TEMP/release/cajeerengine-$(cat VERSION)-dist.zip" sqlite
      - run: bash tools/release-smoke.sh "$RUNNER_TEMP/release/cajeerengine-$(cat VERSION)-dist.zip" pgsql
        env:
          CE_DB_NAME: cajeer_smoke
          CE_DB_USER: cajeer
          CE_DB_PASSWORD: release-smoke
      - run: bash tools/disaster-recovery-dist-smoke.sh "$RUNNER_TEMP/release/cajeerengine-$(cat VERSION)-dist.zip"
      - run: bash tools/update-dist-smoke.sh "$RUNNER_TEMP/release/cajeerengine-$(cat VERSION)-dist.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cajeerengine-verified-release
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256
            ${{ runner.temp }}/release/*.sig
            ${{ runner.temp }}/release/*.manifest.json
            ${{ runner.temp }}/release/*-artifacts.json
          if-no-files-found: error
